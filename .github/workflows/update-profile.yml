name: Update contribution snake

on:
  schedule:
    # 02:17 Asia/Shanghai (18:17 UTC)
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light contribution snake
        uses: dahan8473/snake-and-commits@v1
        with:
          github_user: Kyuubi-Nyan
          output: dist/snake.svg
          theme: blue
          frame: true
          counter: true

      - name: Generate dark contribution snake
        uses: dahan8473/snake-and-commits@v1
        with:
          github_user: Kyuubi-Nyan
          output: dist/snake-dark.svg
          theme: blue
          frame: true
          counter: true

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
