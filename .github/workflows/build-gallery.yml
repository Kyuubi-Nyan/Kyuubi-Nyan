name: Build illustration gallery

on:
  workflow_dispatch:
  push:
    paths:
      - docs/gallery/manifest.json
      - scripts/build-gallery.mjs
      - .github/workflows/build-gallery.yml

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download gallery images
        run: node scripts/build-gallery.mjs

      - name: Commit gallery assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gallery/assets docs/gallery/data.json
          if git diff --cached --quiet; then
            echo "No gallery changes"
          else
            git commit -m "chore: refresh cloneko illustration gallery"
            git push
          fi
