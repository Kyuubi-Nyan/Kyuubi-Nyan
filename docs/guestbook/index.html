<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kyuubi-Nyan 的留言板</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      color: #0d2638;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      background:
        linear-gradient(90deg, rgba(242, 251, 255, 0.02), rgba(7, 22, 40, 0.18)),
        url("../assets/catgirl-bg.jpg") left center / cover fixed no-repeat;
      overflow: hidden;
    }
    .page {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
    }
    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 6px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0d2638;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 14px rgba(255, 255, 255, 1);
      padding: 6px 12px 6px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(10px);
    }
    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.9);
      object-fit: cover;
    }
    .meta {
      color: rgba(7, 22, 40, 0.7);
      font: 12px/1.4 "Cascadia Code", Consolas, monospace;
      letter-spacing: 0.05em;
      white-space: nowrap;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
    }
    .frame {
      width: clamp(420px, 42vw, 570px);
      flex: 1 1 auto;
      min-height: 0;
      align-self: flex-end;
      margin-right: clamp(18px, 8vw, 210px);
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 22px;
      background: rgba(247, 252, 255, 0.42);
      box-shadow: 0 24px 90px rgba(4, 20, 38, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 16px;
      background: #fefefe;
    }
    @media (max-width: 860px) {
      body { background-position: 27% center; }
      .page { padding: 8px; gap: 6px; }
      .bar { justify-content: flex-start; }
      .meta { display: none; }
      .frame { width: 100%; margin-right: 0; border-radius: 16px; padding: 4px; }
      iframe { border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="bar">
      <a class="brand" href="https://github.com/Kyuubi-Nyan">
        <img src="https://github.com/Kyuubi-Nyan.png?size=96" alt="Kyuubi-Nyan 的头像" />
        <span>Kyuubi-Nyan's Guestbook</span>
      </a>
      <span class="meta">TYPE A NAME · LEAVE A MESSAGE · HIT SEND</span>
    </header>
    <section class="frame">
      <iframe
        title="Kyuubi-Nyan 的留言板"
        src="https://chat.getloli.com/room/@Kyuubi-Nyan.github?title=Kyuubi-Nyan%20Github%20%E7%95%99%E8%A8%80%E6%9D%BF"
        allow="clipboard-write"
        referrerpolicy="no-referrer"
      ></iframe>
    </section>
  </main>
</body>
</html>
