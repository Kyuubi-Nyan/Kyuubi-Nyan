<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kyuubi-Nyan 的留言板</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      color: #0d2638;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(245, 252, 255, 0.25), rgba(230, 247, 255, 0.08)),
        url("../assets/catgirl-bg.jpg") center 28% / cover fixed no-repeat;
      overflow: hidden;
    }
    .page {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
    }
    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 6px;
      text-shadow: 0 1px 12px rgba(255, 255, 255, 0.9);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0d2638;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.8);
      object-fit: cover;
    }
    .meta {
      color: rgba(13, 38, 56, 0.72);
      font: 12px/1.4 "Cascadia Code", Consolas, monospace;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .frame {
      width: min(980px, 100%);
      flex: 1 1 auto;
      min-height: 0;
      margin: 0 auto;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 22px 80px rgba(17, 42, 64, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 18px;
      background: #fefefe;
    }
    @media (max-width: 640px) {
      .page { padding: 8px; gap: 6px; }
      .meta { display: none; }
      .frame { border-radius: 16px; padding: 4px; }
      iframe { border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="bar">
      <a class="brand" href="https://github.com/Kyuubi-Nyan">
        <img src="https://github.com/Kyuubi-Nyan.png?size=96" alt="Kyuubi-Nyan 的头像" />
        <span>Kyuubi-Nyan's Guestbook</span>
      </a>
      <span class="meta">TYPE A NAME · LEAVE A MESSAGE · HIT SEND</span>
    </header>
    <section class="frame">
      <iframe
        title="Kyuubi-Nyan 的留言板"
        src="https://chat.getloli.com/room/@Kyuubi-Nyan.github?title=Kyuubi-Nyan%20Github%20%E7%95%99%E8%A8%80%E6%9D%BF"
        allow="clipboard-write"
        referrerpolicy="no-referrer"
      ></iframe>
    </section>
  </main>
</body>
</html>
